name: taekwondo_score
description: Tournament scoring system for Taekwondo (Kyorugi & Poomsae)
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # WebSocket — server (scoreboard/laptop only)
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0

  # WebSocket — client (judge phones)
  web_socket_channel: ^3.0.1

  # Navigation
  go_router: ^14.1.4

  # Local persistence
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Export
  pdf: ^3.11.0
  excel: ^4.0.3
  open_filex: ^4.3.4

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # Audio / Haptic
  flutter_tts: ^4.0.2

  # UI
  google_fonts: ^6.2.1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true